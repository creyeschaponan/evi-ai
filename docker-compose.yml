services:
  # 1. Wake Word Engine (CPU - OpenWakeWord)
  openwakeword:
    image: rhasspy/wyoming-openwakeword:latest
    container_name: jarvis-wakeword
    restart: unless-stopped
    ports:
      - "10400:10400"
    command: ["--preload-model", "ok_nabu", "--custom-model-dir", "/custom"]
    volumes:
      - ./wakewords:/custom

  # 2. Speech-to-Text (GPU - Whisper small en Español)
  faster-whisper:
    image: rhasspy/wyoming-whisper:latest
    container_name: jarvis-whisper
    restart: unless-stopped
    ports:
      - "10300:10300"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: [
      "--model", "small",
      "--language", "es",
      "--beam-size", "1",
      "--data-dir", "/data",
      "--download-dir", "/data"
    ]
    volumes:
      - ./whisper-data:/data

  # 3. Text-to-Speech (CPU - Piper Wyoming)
  piper:
    image: rhasspy/wyoming-piper:latest
    container_name: jarvis-piper
    restart: unless-stopped
    ports:
      - "10200:10200"
    command: [
      "--voice", "es_MX-claude-high",
      "--length-scale", "0.85",
      "--noise-scale", "0.667",
      "--noise-w", "0.8",
      "--data-dir", "/data",
      "--download-dir", "/data"
    ]
    volumes:
      - ./voices:/data

  # 4. Base de Datos Vectorial (PostgreSQL 16 + pgvector)
  postgres-vector:
    image: pgvector/pgvector:pg16
    container_name: jarvis-postgres-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jarvis_secret_local_db_pass_2026}
    volumes:
      - ./supabase/data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d
