services:
  # Base de Datos Vectorial (PostgreSQL 16 + pgvector) para Memoria y RAG
  postgres-vector:
    image: pgvector/pgvector:pg16
    container_name: jarvis-postgres-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jarvis_secret_local_db_pass_2026}
    volumes:
      - ./supabase/data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d
